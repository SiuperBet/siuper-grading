name: Apply grading completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-grading.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated grading files
        env:
          GRADING_GZ_B64: 
          SCANNER_GZ_B64: 
        run: |
          printf '%s' "$GRADING_GZ_B64" | base64 -d | gzip -d > js/grading.js
          printf '%s' "$SCANNER_GZ_B64" | base64 -d | gzip -d > js/scanner.js
          test "$(sha256sum js/grading.js | cut -d' ' -f1)" = "7d5100d7bbfc94a40c0ebfe6c67b9b312931db9ff389f241ad1364cf99bcea53"
          test "$(sha256sum js/scanner.js | cut -d' ' -f1)" = "984c1f84ae8eabe3ce1c9767e58b55f21e50d1b483a40e0588297cc415a41de9"
          rm .github/workflows/apply-grading.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/grading.js js/scanner.js .github/workflows/apply-grading.yml
          git commit -m "Complete grading and scanner workflow"
          git push
