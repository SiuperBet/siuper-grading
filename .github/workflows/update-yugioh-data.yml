name: Update Yu-Gi-Oh data

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: write

concurrency:
  group: update-yugioh-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIRROR_IMAGES: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Update YGOPRODeck catalog and mirror new thumbnails
        run: npm run update:yugioh
      - name: Validate
        run: npm run validate:data
      - name: Commit only real changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yugioh data/search-index.json data/meta.json data/validation-report.json assets/yugioh
          git commit -m "data: update Yu-Gi-Oh catalog"
          git push
