name: Update Yu-Gi-Oh OCG printings

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-yugioh-ocg-printings.yml"
      - "scripts/update-yugioh-ocg-printings.mjs"
  schedule:
    - cron: "41 5 * * 3"

permissions:
  contents: write

concurrency:
  group: update-yugioh-ocg-printings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Ensure unzip
        run: command -v unzip >/dev/null || sudo apt-get install -y unzip
      - run: node scripts/update-yugioh-ocg-printings.mjs
      - run: npm run check:syntax
      - name: Commit OCG printings
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/yugioh-ocg-jp data/yugioh-ocg-sc data/yugioh-ocg-tc)" ]; then
            echo "No OCG printing changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yugioh-ocg-jp data/yugioh-ocg-sc data/yugioh-ocg-tc
          git commit -m "data: update exact Yu-Gi-Oh OCG printings"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          exit 1
