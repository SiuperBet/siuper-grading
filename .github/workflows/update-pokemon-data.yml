name: Update Pokemon data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-pokemon-data.yml"
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: write

concurrency:
  group: update-pokemon-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Update TCGdex catalog
        run: npm run update:pokemon
      - name: Validate
        run: npm run validate:data
      - name: Commit only real changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pokemon data/meta.json data/validation-report.json
          git commit -m "data: update Pokemon catalog"
          git pull --rebase origin main
          git push
