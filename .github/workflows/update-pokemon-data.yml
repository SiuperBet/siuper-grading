name: Update Pokemon data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-pokemon-data.yml"
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: write

concurrency:
  group: update-pokemon-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Update TCGdex catalog
        run: npm run update:pokemon
      - name: Validate
        run: npm run validate:data
      - name: Commit only real changes
        shell: bash
        run: |
          git restore --worktree data/validation-report.json 2>/dev/null || true
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pokemon
          git commit -m "data: update Pokemon catalog"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push raced with another commit; retry $attempt/5"
            sleep 6
          done
          echo "Unable to push after retries"
          exit 1
