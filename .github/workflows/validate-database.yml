name: Validate database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "js/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/validate-database.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm run check:syntax
      - run: npm test
      - run: npm run validate:data
