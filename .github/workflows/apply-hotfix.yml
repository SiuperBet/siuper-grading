name: Apply 0.3.1 hotfix
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-hotfix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated hotfix
        env:
          HOTFIX_ARCHIVE_B64: 
        run: |
          printf '%s' "$HOTFIX_ARCHIVE_B64" | base64 -d > /tmp/hotfix.tar.gz
          tar -xzf /tmp/hotfix.tar.gz
          test "$(sha256sum README.md | cut -d' ' -f1)" = "685ac6d5405c1dff51ff34a84643e090a7324534901a8fb0e1ba49437c5845dd"
          test "$(sha256sum index.html | cut -d' ' -f1)" = "b76c0e804f98ebe7c50ccae1086ed14a5eae300769aa9e8d7f87a473ad6f0d1c"
          test "$(sha256sum js/app.js | cut -d' ' -f1)" = "19e4973a0003b08e0dc303fd80eca12da931a028d06c403f2f8eddbe494be30f"
          test "$(sha256sum js/config.js | cut -d' ' -f1)" = "61f08873d4c83704a963733d0cb629c59d49a413bce69d419f766dacab02b85e"
          test "$(sha256sum package.json | cut -d' ' -f1)" = "5e5335589b2c33cf8d5496edc42f36fd245a21c94ab4fd5d412ccd267551189c"
          test "$(sha256sum service-worker.js | cut -d' ' -f1)" = "79b34165ece62672c6f040bf73406e5e06828b6a316b572cee49179f1047e730"
          test "$(sha256sum tests/app-shell.test.mjs | cut -d' ' -f1)" = "c917617bc40d16ebdcec7d45d3f7ac1800e0fbf2af0906faf500ed96abd8cba4"
          rm .github/workflows/apply-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md index.html js/app.js js/config.js package.json service-worker.js tests/app-shell.test.mjs .github/workflows/apply-hotfix.yml
          git commit -m "Fix album initialization and refresh app shell"
          git push
