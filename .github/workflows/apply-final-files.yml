name: Apply final validated files
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-final-files.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated interface and recognition
        env:
          INDEX_GZ_B64: 
          RECOGNITION_GZ_B64: 
        run: |
          printf '%s' "$INDEX_GZ_B64" | base64 -d | gzip -d > index.html
          printf '%s' "$RECOGNITION_GZ_B64" | base64 -d | gzip -d > js/recognition.js
          test "$(sha256sum index.html | cut -d' ' -f1)" = "9aab111d759637510fad63e2880663a8c04e101133e7f0e68b6b4872919fd7ad"
          test "$(sha256sum js/recognition.js | cut -d' ' -f1)" = "e3e1d24a9a8ebbed651caec2b877d367839a3a7b1750bdffda594e586e2e466e"
          rm .github/workflows/apply-final-files.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/recognition.js .github/workflows/apply-final-files.yml
          git commit -m "Restore validated interface and recognition"
          git push
