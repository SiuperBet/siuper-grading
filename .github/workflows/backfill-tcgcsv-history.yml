name: Backfill TCGCSV history

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backfill-tcgcsv-history.yml"
      - "scripts/backfill-tcgcsv-history.mjs"
      - "data/prices/tcgcsv-map.json"
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

concurrency:
  group: backfill-tcgcsv-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TCGCSV_BACKFILL_BATCH: "3"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Ensure 7zip
        run: command -v 7z >/dev/null || (sudo apt-get update && sudo apt-get install -y p7zip-full)
      - run: npm run backfill:tcgcsv
      - run: npm run check:syntax
      - name: Commit history batch
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/prices/tcgcsv-history)" ]; then
            echo "No history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/tcgcsv-history
          git commit -m "data: backfill TCGCSV price history"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          exit 1
